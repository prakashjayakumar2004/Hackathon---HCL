server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/users/**

        - id: product-service
          uri: http://localhost:8082
          predicates:
            - Path=/bus/**

        - id: booking-service
          uri: http://localhost:8083
          predicates:
            - Path=/bookings/**

        - id: payment-service
          uri: http://localhost:8084
          predicates:
            - Path=/payment/**
logging:
  level:
    org.springframework.cloud.gateway: DEBUG